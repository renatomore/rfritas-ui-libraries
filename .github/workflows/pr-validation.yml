name: 1 - PR Validation

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js and Cache
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          # Use npm for caching, which Turborepo will leverage
          cache: "npm"

      - name: Install Dependencies
        # Use 'npm ci' for faster, more reliable installs in CI
        run: npm ci

      - name: Run Lint
        # 'turbo run lint' will only lint the packages that have changed
        run: npm run lint

      - name: Run Tests
        # 'turbo run test' assumes you have a 'test' script in your package.json files
        run: npm run test

      - name: Run Build
        # 'turbo run build' will build all packages in the correct order
        run: npm run build

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          PR_TITLE="feat: Automatic PR for $BRANCH_NAME"
          gh pr create \
            --base main \
            --title "$PR_TITLE" \
            --body-file .github/PULL_REQUEST_TEMPLATE.md
