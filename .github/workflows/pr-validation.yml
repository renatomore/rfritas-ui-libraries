name: 1 - PR Validation

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "docs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: pull_request
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js and Cache
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          # Use npm for caching, which Turborepo will leverage
          cache: "npm"

      - name: Install Dependencies
        # Use 'npm ci' for faster, more reliable installs in CI
        run: npm ci

      - name: Run Lint
        # 'turbo run lint' will only lint the packages that have changed
        run: npm run lint

      - name: Run Tests
        # 'turbo run test' assumes you have a 'test' script in your package.json files
        run: npm run test

      - name: Run Build
        # 'turbo run build' will build all packages in the correct order
        run: npm run build

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if gh pr list --head "$BRANCH_NAME" --json number --jq '.[0]' | grep -q '[0-9]'; then
            echo "A pull request for branch '$BRANCH_NAME' already exists."
          else
            PR_TITLE="feat: Automatic PR for $BRANCH_NAME"
            gh pr create \
              --base main \
              --title "$PR_TITLE" \
              --body-file .github/PULL_REQUEST_TEMPLATE.md
          fi
